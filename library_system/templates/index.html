<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서관 좌석 키오스크</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding-top: 30px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 600px; margin: 30px auto; }
        .seat { padding: 40px 20px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; color: white; transition: 0.2s; }
        .seat:hover { opacity: 0.8; }
        .empty { background-color: #3498db; }
        .occupied { background-color: #e74c3c; }
    </style>
</head>
<body>
    <h1>📚 도서관 좌석 발권 키오스크</h1>
    <p>원하시는 좌석을 선택 후 전화번호를 입력해 주세요.</p>
    <div class="grid" id="seatGrid"></div>

    <script>
        // 010-1234-5678 형식 검증용 정규표현식
        const phoneRegex = /^010-\d{4}-\d{4}$/;

        async function fetchSeats() {
            const res = await fetch('/api/seats');
            const data = await res.json();
            const grid = document.getElementById('seatGrid');
            grid.innerHTML = '';
            
            data.seats.forEach(seat => {
                const div = document.createElement('div');
                div.className = `seat ${seat.status === 'EMPTY' ? 'empty' : 'occupied'}`;
                div.innerText = `${seat.id}번 좌석\n${seat.status === 'EMPTY' ? '[발권 가능]' : '[사용 중]'}`;
                
                div.onclick = () => handleSeat(seat);
                grid.appendChild(div);
            });
        }

        async function handleSeat(seat) {
            if (seat.status === 'EMPTY') {
                const phone = prompt(`[${seat.id}번 좌석 발권]\n전화번호를 입력하세요 (예: 010-1234-5678):`);
                if (!phone) return;
                
                // [수정됨] 하이픈 포함 11자리 형식 확인
                if (!phoneRegex.test(phone)) {
                    alert("전화번호는 반드시 010-1234-5678 형식(하이픈 포함 11자리)으로 입력해야 합니다.");
                    return;
                }
                
                const res = await fetch(`/api/issue/${seat.id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone })
                });
                const result = await res.json();
                alert(result.message);
            } else {
                const phone = prompt(`[${seat.id}번 좌석 반납]\n발권 시 입력한 전화번호를 입력하세요 (예: 010-1234-5678):`);
                if (!phone) return;
                
                const res = await fetch(`/api/return/${seat.id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone })
                });
                const result = await res.json();
                alert(result.message);
            }
            fetchSeats();
        }

        setInterval(fetchSeats, 1000);
        fetchSeats();
    </script>
</body>
</html>
