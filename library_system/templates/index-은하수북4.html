<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도서관 좌석 키오스크</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Apple SD Gothic Neo', Arial, sans-serif;
            text-align: center; background-color: #f4f4f9; padding: 30px 16px;
            margin: 0;
        }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .desc { color: #666; font-size: 14px; margin-bottom: 4px; }

        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 18px; max-width: 600px; margin: 28px auto;
        }
        .seat {
            padding: 34px 16px; font-size: 19px; font-weight: bold;
            border-radius: 10px; cursor: pointer; color: white;
            transition: 0.15s; border: 3px solid transparent;
            white-space: pre-line; user-select: none;
        }
        .seat:hover { opacity: 0.85; transform: translateY(-2px); }
        .seat.selected { border-color: #1a1a1a; }
        .empty    { background-color: #3498db; }
        .occupied { background-color: #e74c3c; }

        /* 전화번호 입력 패널 (prompt 창 대신 사용) */
        .panel {
            max-width: 600px; margin: 0 auto; background: white;
            border-radius: 10px; padding: 22px; text-align: left;
            box-shadow: 0 2px 14px rgba(0,0,0,0.12); display: none;
        }
        .panel.show { display: block; }
        .panel h3 { margin: 0 0 14px; font-size: 17px; }
        .panel input {
            width: 100%; padding: 12px 14px; font-size: 17px;
            border: 2px solid #ddd; border-radius: 7px; margin-bottom: 12px;
            font-family: inherit;
        }
        .panel input:focus { outline: none; border-color: #3498db; }
        .btns { display: flex; gap: 8px; }
        .btns button {
            flex: 1; padding: 12px; font-size: 15px; font-weight: 600;
            border: none; border-radius: 7px; cursor: pointer;
            font-family: inherit;
        }
        .ok     { background: #3498db; color: white; }
        .ok:hover { background: #2980b9; }
        .cancel { background: #e8e8e8; color: #333; }
        .cancel:hover { background: #dcdcdc; }
        .hint { font-size: 12.5px; color: #888; margin-bottom: 12px; }

        /* 결과 메시지 (alert 창 대신 화면에 표시) */
        .msg {
            max-width: 600px; margin: 16px auto 0; padding: 13px 16px;
            border-radius: 8px; font-size: 14.5px; text-align: left;
            display: none; line-height: 1.5;
        }
        .msg.show { display: block; }
        .msg.good { background: #d4f4dd; color: #1a5c30; border: 1px solid #7dcb96; }
        .msg.bad  { background: #fde2e2; color: #8b1a1a; border: 1px solid #f0a0a0; }

        .links { margin-top: 30px; font-size: 13px; color: #888; }
        .links a { color: #3498db; margin: 0 8px; }
    </style>
</head>
<body>
    <h1>📚 도서관 좌석 발권 키오스크</h1>
    <p class="desc">원하시는 좌석을 선택 후 전화번호를 입력해 주세요.</p>

    <div class="grid" id="seatGrid"></div>

    <!-- prompt() 창이 브라우저에 차단되는 문제가 있어 페이지 안 입력창으로 바꿈 -->
    <div class="panel" id="panel">
        <h3 id="panelTitle"></h3>
        <div class="hint">하이픈(-)을 포함해서 입력해 주세요. 예) 010-1234-5678</div>
        <input type="tel" id="phoneInput" placeholder="010-1234-5678"
               maxlength="13" autocomplete="off">
        <div class="btns">
            <button class="ok" id="okBtn">확인</button>
            <button class="cancel" id="cancelBtn">취소</button>
        </div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="links">
        <a href="/vision" target="_blank">좌석 감지 상태</a> ·
        <a href="/admin" target="_blank">관리자</a>
    </div>

<script>
// ============================================================================
//  변경 사항 요약
//    1) prompt() / alert() 를 없앴다.
//       브라우저가 이 창들을 차단하면 아무 반응 없이 멈춰버려서 원인을 알 수 없다.
//       페이지 안의 입력창과 메시지 영역으로 대체했다.
//    2) 모든 통신에 try/catch 를 넣었다.
//       예전 코드는 에러가 나면 조용히 죽어서 화면에 아무 일도 안 일어났다.
//    3) 입력창이 열려 있는 동안에는 자동 새로고침을 멈춘다.
//       1초마다 화면을 다시 그리면서 입력 중인 값이 날아가는 걸 막기 위함.
// ============================================================================

const phoneRegex = /^010-\d{4}-\d{4}$/;

let seats = [];          // 서버에서 받은 좌석 목록
let selectedSeat = null; // 지금 입력창이 열려 있는 좌석
let polling = true;      // 자동 새로고침 여부

const grid       = document.getElementById('seatGrid');
const panel      = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const phoneInput = document.getElementById('phoneInput');
const msgBox     = document.getElementById('msg');


// ---------------------------------------------------------------- 메시지 표시
function showMsg(text, isGood) {
    msgBox.textContent = text;
    msgBox.className = 'msg show ' + (isGood ? 'good' : 'bad');
}

function clearMsg() {
    msgBox.className = 'msg';
}


// ---------------------------------------------------------------- 좌석 그리기
async function fetchSeats() {
    if (!polling) return;              // 입력 중이면 화면을 건드리지 않는다

    try {
        const res = await fetch('/api/seats');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        seats = data.seats;
        renderSeats();
    } catch (e) {
        showMsg('서버와 통신할 수 없습니다: ' + e.message, false);
    }
}

function renderSeats() {
    grid.innerHTML = '';
    seats.forEach(seat => {
        const div = document.createElement('div');
        const isEmpty = seat.status === 'EMPTY';
        div.className = 'seat ' + (isEmpty ? 'empty' : 'occupied');
        if (selectedSeat && selectedSeat.id === seat.id) {
            div.className += ' selected';
        }
        div.innerText = `${seat.id}번 좌석\n${isEmpty ? '[발권 가능]' : '[사용 중]'}`;
        div.onclick = () => openPanel(seat);
        grid.appendChild(div);
    });
}


// ------------------------------------------------------------- 입력창 열기/닫기
function openPanel(seat) {
    selectedSeat = seat;
    polling = false;                   // 입력하는 동안 자동 새로고침 정지
    clearMsg();

    const isEmpty = seat.status === 'EMPTY';
    panelTitle.textContent = isEmpty
        ? `${seat.id}번 좌석 발권 — 전화번호를 입력하세요`
        : `${seat.id}번 좌석 반납 — 발권 시 입력한 전화번호를 입력하세요`;

    phoneInput.value = '';
    panel.classList.add('show');
    phoneInput.focus();
    renderSeats();                     // 선택된 좌석에 테두리 표시
}

function closePanel() {
    selectedSeat = null;
    polling = true;                    // 자동 새로고침 재개
    panel.classList.remove('show');
    fetchSeats();
}


// ----------------------------------------------------------------- 발권 / 반납
async function submit() {
    if (!selectedSeat) return;

    const phone = phoneInput.value.trim();

    if (!phone) {
        showMsg('전화번호를 입력해 주세요.', false);
        phoneInput.focus();
        return;
    }

    if (!phoneRegex.test(phone)) {
        showMsg('전화번호는 010-1234-5678 형식(하이픈 포함)으로 입력해야 합니다. '
                + `입력한 값: "${phone}"`, false);
        phoneInput.focus();
        return;
    }

    const isIssue = selectedSeat.status === 'EMPTY';
    const url = isIssue
        ? `/api/issue/${selectedSeat.id}`
        : `/api/return/${selectedSeat.id}`;

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        });

        // 서버가 400 을 줘도 본문에 이유가 담겨 있으므로 먼저 읽는다
        let result;
        try {
            result = await res.json();
        } catch (e) {
            throw new Error('서버 응답을 해석할 수 없습니다 (HTTP ' + res.status + ')');
        }

        closePanel();
        showMsg(result.message || (res.ok ? '완료되었습니다.' : '실패했습니다.'),
                result.success === true);

    } catch (e) {
        // 여기까지 왔다면 네트워크 자체가 실패한 것 (서버 꺼짐 등)
        showMsg('요청을 보내지 못했습니다: ' + e.message
                + ' — 서버가 켜져 있는지 확인해 주세요.', false);
    }
}


// ------------------------------------------------------------------- 이벤트 연결
document.getElementById('okBtn').onclick = submit;
document.getElementById('cancelBtn').onclick = closePanel;

phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') closePanel();
});

// 숫자만 치면 하이픈을 자동으로 넣어준다 (01012345678 -> 010-1234-5678)
phoneInput.addEventListener('input', () => {
    const digits = phoneInput.value.replace(/[^0-9]/g, '');
    if (digits.length <= 3) {
        phoneInput.value = digits;
    } else if (digits.length <= 7) {
        phoneInput.value = digits.slice(0, 3) + '-' + digits.slice(3);
    } else {
        phoneInput.value = digits.slice(0, 3) + '-' + digits.slice(3, 7)
                         + '-' + digits.slice(7, 11);
    }
});


// ------------------------------------------------------------------------ 시작
setInterval(fetchSeats, 1000);
fetchSeats();
</script>
</body>
</html>
