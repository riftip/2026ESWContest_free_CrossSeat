<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서관 관리자 페이지</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; text-align: center; padding-top: 30px;}
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 800px; margin: 30px auto; }
        .card { background-color: #34495e; padding: 25px 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background-color: #e74c3c; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        .phone-text { color: #f1c40f; font-weight: bold; font-size: 1.1rem; margin: 10px 0; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>🔐 관리자 통합 제어 시스템</h1>
    <p>전체 좌석 현황 조회 및 강제 반납 제어</p>
    <div class="grid" id="adminGrid"></div>

    <script>
        async function fetchAdminSeats() {
            const res = await fetch('/api/seats');
            const data = await res.json();
            const grid = document.getElementById('adminGrid');
            grid.innerHTML = '';
            
            data.seats.forEach(seat => {
                const div = document.createElement('div');
                div.className = 'card';
                
                let statusHtml = `<h2>${seat.id}번 좌석</h2>`;
                
                if (seat.status === 'EMPTY') {
                    statusHtml += `<p>상태: <span style="color:#2ecc71; font-weight:bold;">빈 좌석</span></p>`;
                    statusHtml += `<p class="phone-text">이용자: 없음</p>`;
                    statusHtml += `<button class="btn" disabled>강제 반납 (불가)</button>`;
                } else {
                    statusHtml += `<p>상태: <span style="color:#e74c3c; font-weight:bold;">사용 중</span></p>`;
                    statusHtml += `<p class="phone-text">번호: ${seat.phone}</p>`;
                    statusHtml += `<button class="btn" onclick="forceReturn(${seat.id})">🚨 강제 반납</button>`;
                }
                
                div.innerHTML = statusHtml;
                grid.appendChild(div);
            });
        }

        async function forceReturn(seatId) {
            const pin = prompt(`[${seatId}번 좌석 강제 반납]\n관리자 비밀번호를 입력하세요 (기본: 1234):`);
            if (!pin) return;

            const res = await fetch(`/api/admin/force_return/${seatId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pin: pin })
            });
            const result = await res.json();
            alert(result.message);
            
            if (result.success) {
                fetchAdminSeats();
            }
        }

        setInterval(fetchAdminSeats, 1000);
        fetchAdminSeats();
    </script>
</body>
</html>
